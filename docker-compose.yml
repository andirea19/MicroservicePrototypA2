services:
  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    environment:
      - PET_SERVICE_URL=http://pet-service:8000
      - CALENDAR_SERVICE_URL=http://calendar-service:8000
      - PET_API_SERVICE_URL=http://pet-api-service:8000
    depends_on:
      - pet-service
      - calendar-service
      - pet-api-service

  pet-service:
    build: ./pet-service
    ports:
      - "8001:8000"

  calendar-service:
    build: ./calendar-service
    ports:
      - "8002:8000"

  pet-api-service:
    build: ./pet-api-service
    ports:
      - "8003:8000"